syntax = "proto3";

package tasks;

message Empty{}

message Task {
  string id = 1;
  string title = 2;
  bool completed = 3;
}

message TaskList {
  repeated Task tasks = 1;
}

service TaskService{
  rpc GetTasks (Empty) returns (TaskList);
}


